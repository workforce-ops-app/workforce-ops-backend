# The backend's Python project: dependencies, and settings for the tools CI runs.
# Versions are pinned exactly; Dependabot proposes updates (decision 0011).

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "workforce-ops-backend"
version = "0.1.0"
description = "API for the Workforce Operations Application"
readme = "README.md"
requires-python = "==3.13.*"
dependencies = [
    "fastapi==0.142.2",
    "uvicorn==0.54.0",
    "pydantic-settings==2.15.0",
    "sqlalchemy==2.1.1",
    "alembic==1.20.0",
    "pymysql==1.2.3",
    # PyMySQL needs this for MySQL 8's default sign-in method (caching_sha2_password).
    "cryptography==50.0.2",
    "uuid6==2025.0.1",
]

[project.optional-dependencies]
dev = [
    "ruff==0.16.9",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "httpx2==2.13.1",
    "pip-audit==2.10.1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle: basic style errors
    "F",       # pyflakes: unused names, undefined names
    "I",       # import order
    "B",       # bugbear: likely bugs
    "UP",      # pyupgrade: modern Python syntax
    "SIM",     # simpler equivalents
    "S",       # bandit: security problems (SQL built from strings, hardcoded secrets, ...)
]

[tool.ruff.lint.per-file-ignores]
# Tests use plain assert on purpose.
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.13"
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
strict_equality = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
