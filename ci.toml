# Operations run by CI and locally with:  python ../.github/scripts/ci_runner.py
# An operation whose `requires` paths are missing is skipped and the report says why,
# so checks switch on automatically as the project grows. Order here = report order.
# A failing operation can be bypassed with the label bypass:<name>, except
# pr-policy and secret-scan. See the contributor docs before using a bypass.

[[setup]]
run = "python -m pip install --upgrade pip"
requires = ["pyproject.toml"]
local = false

[[setup]]
run = 'python -m pip install -e ".[dev]"'
requires = ["pyproject.toml"]
local = false

[[operation]]
name = "secret-scan"
run = 'docker run --rm -v "{repo}:/repo" -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e "GIT_CONFIG_VALUE_0=*" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --no-banner'
requires = [".git"]
pass_summary = "no secrets found"

[[operation]]
name = "audit"
run = "pip-audit --skip-editable --progress-spinner off"
requires = ["pyproject.toml"]
pass_summary = "no known vulnerabilities"

[[operation]]
name = "format-check"
run = "ruff format --check ."
requires = ["pyproject.toml"]

[[operation]]
name = "lint"
run = "ruff check ."
requires = ["pyproject.toml"]

[[operation]]
name = "typecheck"
run = "mypy app"
requires = ["pyproject.toml", "app"]

[[operation]]
name = "unit-test"
run = "pytest tests/unit -q"
requires = ["tests/unit"]

[[operation]]
name = "migration-check"
run = "python -m scripts.check_migrations"
requires = ["alembic.ini", "scripts/check_migrations.py"]

[[operation]]
name = "security-test"
run = "pytest tests/security -q"
requires = ["tests/security"]

[[operation]]
name = "build"
run = "docker build -t workforce-ops-backend:ci ."
requires = ["Dockerfile"]
pass_summary = "built workforce-ops-backend:ci"
timeout_minutes = 20

[[operation]]
name = "integration-test"
run = "python -m scripts.integration_test"
requires = ["docker-compose.yml", "tests/integration", "scripts/integration_test.py"]
timeout_minutes = 20
